services:
  sipserver:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - ./config:/app/config
      - ./certs:/app/certs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - rtpengine
    restart: unless-stopped

  rtpengine:
    image: drachtio/rtpengine:latest
    network_mode: host
    command: >
      rtpengine
      --interface=${PUBLIC_IP:-0.0.0.0}
      --listen-ng=127.0.0.1:22222
      --port-min=20000
      --port-max=30000
      --log-level=5
      --no-fallback
    restart: unless-stopped
